<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eca's Adventure</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#35264a;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 8px;padding-bottom:max(14px,env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;
  font-family:"Courier New",Courier,monospace;font-weight:700;color:#5a3a55;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{width:min(100%,640px,calc((100vh - 250px) * 1.3333));width:min(100%,640px,calc((100dvh - 250px) * 1.3333));min-width:240px}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff3d6;font-size:17px;margin-bottom:14px}
#hud .btns{display:flex;gap:8px}
.px{background:#fff7e8;color:#5a3a55;border:0;
  box-shadow:0 -3px 0 #5a3a55,0 3px 0 #5a3a55,-3px 0 0 #5a3a55,3px 0 0 #5a3a55}
button{font:inherit;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.btn{padding:5px 10px;font-size:13px;margin:0 3px}
.btn:active,.go:active{transform:translateY(2px)}
#stage{position:relative;box-shadow:0 0 0 4px #fff0f6,0 0 0 8px #5a3a55}
canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:4/3;background:#cde8b8}
#note{position:absolute;left:4%;right:4%;bottom:5%;padding:.6em .8em;text-align:center;font-size:1em;
  opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
#note.show{opacity:1;transform:none}
#title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:5%;text-align:center}
#title .px{padding:.7em 1em;background:rgba(255,247,232,.94)}
#title h1{margin:0;font-size:1.9em;line-height:1.1;color:#d6407f;text-shadow:2px 2px 0 #e3d1f5}
#title p{margin:.4em 0 0}
.go{margin-top:.7em;padding:.5em 1.4em;font-size:1.25em;background:#ff7fae;color:#fff}
.go.alt{background:#9b7fe0}
#startBtn,#l2Btn,#l3Btn,#outfitBtn,#custGo{color:#000}
#cust{position:fixed;inset:0;display:none;overflow:auto;padding:14px;background:rgba(53,38,74,.84);z-index:6}
#cust.show{display:flex}
#cust .px{margin:auto;width:min(100%,440px);padding:18px 16px;text-align:center;font-size:15px;line-height:1.4}
#cust h2{margin:0 0 .2em;font-size:1.6em;color:#d6407f}#cust p{margin:.2em 0 .5em}
#prevCv{width:120px;height:160px;aspect-ratio:auto;image-rendering:pixelated;background:linear-gradient(#e3d1f5,#fff3d6);box-shadow:0 0 0 3px #5a3a55;margin:.5em auto}
.grp{margin:.8em 0 .4em;font-size:.8em;color:#8a5fb0;text-transform:uppercase;letter-spacing:.1em}
.opts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.sw{width:38px;height:38px;padding:0;border:0;box-shadow:0 0 0 2px #5a3a55;touch-action:manipulation;color:#5a3a55;font-size:15px}
.sw.on{box-shadow:0 0 0 2px #5a3a55,0 0 0 5px #ffd96b}
.sw.txt{width:auto;padding:0 12px;font-size:14px;background:#fff7e8}.sw.txt.on{background:#ffd1e3}.go.sm{font-size:1em}.go:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:.7em;justify-content:center;flex-wrap:wrap}
#note.top{bottom:auto;top:5%}
#l3Gift{position:absolute;left:0;right:0;bottom:7%;margin:0 auto;width:max-content;z-index:3;font-size:1.3em}
#l3end{position:absolute;left:0;right:0;bottom:4%;display:none;flex-direction:column;align-items:center;gap:.6em;z-index:3}
#l3end.show{display:flex}#l3end .go{margin:0}
body.l3 #joy{display:none}
#love{position:absolute;left:0;top:0;padding:.3em .6em;font-size:.8em;white-space:nowrap;color:#d6407f;opacity:0;transition:opacity .25s;pointer-events:none;transform:translate(-50%,-100%);z-index:2}
#love.show{opacity:1}
#love::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-4px;border:4px solid transparent;border-top:4px solid #5a3a55;border-bottom:0}
#pad2{display:none;flex-direction:column;align-items:center;gap:10px;margin:6px;touch-action:none}
#pad2 .row{flex-wrap:nowrap;gap:10px}
#pad2 button{width:68px;height:60px;font-size:22px;padding:0;color:#5a3a55}
#pad2 .jump{width:146px;font-size:17px;background:#ffd1e3}
body.l2 #pad2{display:flex}body.l2 #joy{display:none}
#joy{position:relative;flex:none;width:136px;height:136px;margin:6px;border-radius:50%;touch-action:none;
  background:rgba(255,247,232,.16);box-shadow:0 0 0 3px #fff0f6,0 0 0 6px #5a3a55}
#joy::before{content:"";position:absolute;inset:34px;border-radius:50%;border:3px dotted rgba(255,240,246,.45)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:#ff7fae;box-shadow:0 0 0 3px #fff0f6,0 0 0 6px #5a3a55,inset -5px -5px 0 #e8639a,inset 5px 5px 0 #ffb3cf;pointer-events:none}
@media (hover:hover) and (pointer:fine){#joy{display:none}#pad2{display:none!important}}
@media (orientation:landscape) and (max-height:520px){
  body{flex-direction:row;gap:14px;padding:6px 14px}
  #app{width:min(calc(100vw - 220px),640px,calc((100vh - 64px) * 1.3333));width:min(calc(100vw - 220px),640px,calc((100dvh - 64px) * 1.3333))}
  #hud{margin-bottom:8px;font-size:14px}
}
@media (max-width:420px){#hud{font-size:15px}.btn{padding:5px 8px;font-size:12px}}
#end{position:fixed;inset:0;display:none;overflow:auto;padding:16px;background:rgba(53,38,74,.74);z-index:5}
#end.show{display:flex}
#end .px{margin:auto;max-width:460px;padding:22px 20px;font-size:16px;line-height:1.55;-webkit-user-select:text;user-select:text}
#end h2{margin:0 0 .6em;font-size:1.4em;color:#d6407f;text-align:center}
#end p{margin:0 0 .9em}
#end .sig{text-align:right;color:#8a5fb0;margin-bottom:1em}
#end .go{display:block;margin:.4em auto 0}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="count">Hearts: 0/5</span>
    <span class="btns">
      <button class="px btn" id="pauseBtn">Pause</button>
      <button class="px btn" id="muteBtn">Sound: on</button>
    </span>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="note" class="px"></div>
    <div id="love" class="px">I love you, bby ♡</div>
    <button class="px go" id="l3Gift" style="display:none">Open Your Final Gift</button>
    <div id="l3end"><button class="px go sm" id="l3Again">Play Our Adventure Again</button><button class="px go alt sm" id="l3Read">Read My Letter Again</button></div>
    <div id="title">
      <div class="px"><h1>Eca's Adventure</h1><p>made with love, just for you ♡</p></div>
      <div class="px"><p>Collect all 5 hearts to unlock your little surprise.</p>
        <div class="row"><button class="px go" id="startBtn">Start</button><button class="px go alt sm" id="l2Btn">Level 2 🔒</button><button class="px go alt sm" id="l3Btn">Level 3 🔒</button><button class="px go alt sm" id="outfitBtn">👗 Outfit</button></div></div>
    </div>
  </div>
</div>
<div id="joy" aria-label="Joystick"><div id="knob"></div></div>
<div id="pad2" aria-label="Level 2 controls"><div class="row"><button class="px" data-k="l" aria-label="Left">◀</button><button class="px" data-k="r" aria-label="Right">▶</button></div><button class="px jump" data-k="j" aria-label="Jump">JUMP ▲</button></div>
<div id="cust"><div class="px">
  <h2 id="custTitle"></h2><p id="custText"></p>
  <canvas id="prevCv" width="24" height="32"></canvas>
  <div class="grp">Style</div><div class="opts" id="rowStyle"></div>
  <div class="grp">Outfit color</div><div class="opts" id="rowColor"></div>
  <div class="grp">Hair</div><div class="opts" id="rowHair"></div>
  <div class="grp">Bow</div><div class="opts" id="rowBow"></div>
  <button class="px go" id="custGo">Start the Adventure ♡</button>
</div></div>
<div id="end"><div class="px">
  <h2 id="endTitle"></h2><div id="endMsg"></div><p class="sig" id="endSig"></p>
  <button class="px go" id="againBtn">Play Again</button>
  <button class="px go alt" id="nextBtn" style="display:none"></button>
</div></div>

<script>
/* ===== EDIT ME: the five love notes (shown in the order hearts are collected) ===== */
const NOTES = [
  "You make my days a little brighter. ♡",
  "I'm always rooting for you, Eca.",
  "Don't forget to take care of yourself, bby.",
  "Even on difficult days, you are so loved.",
  "Out of all the people in this world, I choose you."
];

/* ===== EDIT ME: the ending text ===== */
const ENDING_TITLE = "For My Favorite Person ♡";
const ENDING_MESSAGE =
"Hi, bby.\n\n" +
"I made this little world just for you. It may be small, but every little detail comes from my heart.\n\n" +
"I hope you always remember that you don't have to be perfect, and you don't have to have everything figured out. I'm proud of you, I'm rooting for you, and I hope life gives you more reasons to smile.\n\n" +
"Thank you for being you.\n\n" +
"I love you, Eca. Always. ♡";
const ENDING_SIGNATURE = "love, your favorite person ♡";

/* ===== Setup ===== */
const W = 160, H = 120, TOTAL = NOTES.length;
const $ = id => document.getElementById(id);
const cv = $('game');
let ctx = cv.getContext('2d');
cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
const r = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function rng(seed){ return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ===== Audio (starts only after a click/tap; game works without it) ===== */
let AC = null, muted = false;
function initAudio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } }
function toneAt(f, s, d = .12, type = 'square', v = .04){
  if (!AC || muted) return;
  try { const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, s);
    g.gain.exponentialRampToValueAtTime(.0001, s + d); o.connect(g); g.connect(AC.destination);
    o.start(s); o.stop(s + d); } catch (e) {}
}
function tone(f, d = .12, t = 0, type = 'square', v = .04){ if (AC) toneAt(f, AC.currentTime + t, d, type, v); }
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
/* Soft chiptune lullaby (C - Am - F - G), 8th-note steps, loops forever */
const MELODY = [659,0,784,0,659,587,523,0, 523,0,659,0,587,523,440,0, 440,0,523,0,440,392,349,0, 392,494,587,0,494,392,0,0];
const BASS = [131, 110, 175, 98], STEP = 60 / 92 / 2;
const MELODY2 = [440,0,523,0,659,523,440,0, 349,0,440,0,523,440,349,0, 392,0,523,0,659,523,392,0, 392,0,494,0,587,494,392,0];
const BASS2 = [110, 175, 131, 98];
let musicStep = 0, musicNext = 0, musicTimer = null;
function musicTick(){
  if (!AC) return;
  const quiet = paused || state === 'gift' || state === 'l2win' || state === 'l3open';
  if (quiet || musicNext < AC.currentTime) musicNext = Math.max(musicNext, AC.currentTime + .05);
  if (quiet) return;
  while (musicNext < AC.currentTime + .3) {
    const i = musicStep % 32, m = (level >= 2 ? MELODY2 : MELODY)[i];
    if (m) toneAt(m, musicNext, STEP * 1.7, 'triangle', .03);
    if (i % 8 === 0 || i % 8 === 4) toneAt((level >= 2 ? BASS2 : BASS)[Math.floor(i / 8)], musicNext, STEP * 3.5, 'sine', .05);
    musicNext += STEP; musicStep++;
  }
}
function startMusic(){ if (AC && !musicTimer) musicTimer = setInterval(musicTick, 80); }
const sfxCollect = () => [659, 880, 1175].forEach((f, i) => tone(f, .14, i * .07));
const sfxEnding = () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .25, i * .16, 'triangle', .07));

/* ===== World ===== */
const obstacles = [
  { k: 'tree', x: 28, y: 56 }, { k: 'tree', x: 128, y: 52 }, { k: 'tree', x: 92, y: 46 },
  { k: 'bush', x: 63, y: 85 }, { k: 'bush', x: 113, y: 95 }, { k: 'bush', x: 17, y: 105 }
];
obstacles.forEach(o => o.box = o.k === 'tree' ? [o.x - 3, o.y - 3, 6, 3] : [o.x - 7, o.y - 4, 14, 4]);
const FLOWERS = [];
const HEART_SPOTS = [[16, 78], [140, 72], [75, 104], [58, 64], [112, 66]];
const BOUNDS = { x0: 5, x1: 155, y0: 36, y1: 117 };
const START = { x: 80, y: 84 };

const HEART_BIG = [".xx.xx.", "xxxxxxx", "xxxxxxx", ".xxxxx.", "..xxx..", "...x..."];
const HEART_TINY = [".x.x.", "xxxxx", "xxxxx", ".xxx.", "..x.."];
function sprite(map, cx, cy, c, s = 1, hl = null){
  const ox = Math.round(cx - map[0].length * s / 2), oy = Math.round(cy - map.length * s / 2);
  for (let y = 0; y < map.length; y++) for (let x = 0; x < map[y].length; x++)
    if (map[y][x] === 'x') r(ox + x * s, oy + y * s, s, s, (hl && x === 1 && y === 1) ? hl : c);
}

/* Static background drawn once to an offscreen canvas */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
function buildBackground(){
  const c = bg.getContext('2d'), R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  ['#7b5ea7', '#9a68b9', '#c07ec3', '#e690b8', '#ffa9ae', '#ffc8a2', '#ffe3b0'].forEach((col, i) => R(0, i * 5, W, 5, col));
  for (let y = -10; y <= 10; y++) { const w = Math.floor(Math.sqrt(100 - y * y)); R(112 - w, 30 + y - 4, w * 2, 1, '#fff1c1'); }
  R(0, 30, W, 8, '#e690b8');
  const hills = [[0, 20, 28], [36, 26, 36], [84, 22, 30], [118, 27, 42]];
  hills.forEach(([x, h, w]) => { for (let i = 0; i < h / 3; i++) R(x + i * 2, 36 - h / 3 + i - 4 + 8 - i, Math.max(w - i * 4, 2), 1, '#9bc9a3'); });
  R(0, 34, W, 4, '#9bc9a3');
  for (let y = 38, row = 0; y < H; y += 8, row++) for (let x = 0; x < W; x += 8)
    R(x, y, 8, 8, (x / 8 + row) % 2 ? '#bfe3a8' : '#b4dc9d');
  const rnd = rng(7);
  for (let i = 0; i < 70; i++) { const x = Math.floor(rnd() * W), y = 38 + Math.floor(rnd() * 80);
    R(x, y, 1, 2, '#8cc784'); R(x + 1, y + 1, 1, 1, '#8cc784'); }
  const cols = ['#ff8fb8', '#fff3d6', '#c9a6f0', '#ffd96b'];
  for (let i = 0, n = 0; n < 26 && i < 200; i++) {
    const x = 6 + Math.floor(rnd() * 148), y = 40 + Math.floor(rnd() * 74);
    if (obstacles.some(o => x > o.box[0] - 8 && x < o.box[0] + o.box[2] + 8 && y > o.box[1] - 8 && y < o.box[1] + 8)) continue;
    const col = cols[n % 4]; n++;
    FLOWERS.push({ x, y, col, cd: 0, pop: 0 });
  }
}

function drawTree(x, y){
  r(x - 1, y - 9, 3, 10, '#8a5a44'); r(x + 1, y - 9, 1, 10, '#6e4636'); r(x - 4, y, 9, 1, 'rgba(60,90,60,.28)');
  r(x - 7, y - 16, 14, 8, '#6fbf73'); r(x - 5, y - 21, 10, 5, '#7fce80'); r(x - 9, y - 14, 18, 5, '#6fbf73');
  r(x - 9, y - 11, 18, 3, '#55a45e'); r(x - 5, y - 9, 10, 1, '#55a45e'); r(x - 4, y - 20, 3, 2, '#a8e59a');
  [[-5, -15], [3, -18], [5, -12], [-2, -11], [-7, -11]].forEach(([dx, dy]) => r(x + dx, y + dy, 2, 2, '#ffb3cf'));
}
function drawBush(x, y){
  r(x - 8, y, 16, 1, 'rgba(60,90,60,.25)'); r(x - 7, y - 5, 14, 5, '#5fb067'); r(x - 5, y - 8, 10, 4, '#74c77a');
  r(x - 7, y - 2, 14, 2, '#4a9955'); r(x - 3, y - 7, 3, 1, '#a8e59a');
  r(x - 4, y - 4, 2, 2, '#ff8fb8'); r(x + 2, y - 5, 2, 2, '#fff3d6'); r(x + 5, y - 2, 1, 1, '#ff8fb8');
}

/* ===== Player ===== */
const player = { x: START.x, y: START.y, dir: 'down', moving: false, t: 0 };
const STYLE_NAMES = ['Dress', 'Hoodie', 'Overalls'];
const DRESS_COLORS = [{ n: 'Pink', c: '#ff8fb8', d: '#ff6fa6' }, { n: 'Lavender', c: '#c9a6f0', d: '#a47fd6' }, { n: 'Sky', c: '#8ec5ff', d: '#6aa7e8' },
  { n: 'Mint', c: '#9fe3c0', d: '#74c99f' }, { n: 'Sunny', c: '#ffd96b', d: '#f0b84a' }, { n: 'Cherry', c: '#ff6b7a', d: '#e04a5c' }];
const HAIRS = [{ n: 'Brown', c: '#6b3f2a' }, { n: 'Black', c: '#2f2a3a' }, { n: 'Honey', c: '#d9a35a' }, { n: 'Cocoa', c: '#9a5b3f' }, { n: 'Pastel pink', c: '#ff9fc4' }];
const BOWS = [{ n: 'Pink', c: '#ff5c93', l: '#ffd1e3' }, { n: 'Blue', c: '#5aa0ff', l: '#c4deff' }, { n: 'Yellow', c: '#ffc93c', l: '#fff0b0' },
  { n: 'White', c: '#ffffff', l: '#ffd1e3' }, { n: 'No bow', c: null, l: null }];
function drawPlayer(){
  const x = Math.round(player.x), y = Math.round(player.y), f = player.moving && Math.floor(player.t * 9) % 2;
  const o = outfit, dress = DRESS_COLORS[o.color].c, dd = DRESS_COLORS[o.color].d, hair = HAIRS[o.hair].c, bow = BOWS[o.bow];
  const sh = '#7a4a6a', skin = '#ffd9b8';
  r(x - 5, y, 10, 1, 'rgba(60,90,60,.3)');
  r(x - 2, y - 3, 1, 2, skin); r(x + 1, y - 3, 1, 2, skin);
  r(x - 3 + (f ? 1 : 0), y - 1, 2, 1, sh); r(x + 1 - (f ? 1 : 0), y - 1, 2, 1, sh);
  if (o.style === 0) {            /* dress */
    r(x - 3, y - 8, 6, 5, dress); r(x - 4, y - 4, 8, 1, dd); r(x - 1, y - 8, 2, 1, '#fff3d6');
    r(x - 4, y - 8, 1, 3, skin); r(x + 3, y - 8, 1, 3, skin);
  } else if (o.style === 1) {     /* hoodie + shorts */
    r(x - 3, y - 8, 6, 4, dress); r(x - 4, y - 8, 1, 4, dress); r(x + 3, y - 8, 1, 4, dress); r(x - 2, y - 5, 4, 1, dd);
    r(x - 1, y - 8, 1, 2, '#fff3d6'); r(x + 1, y - 8, 1, 2, '#fff3d6'); r(x - 3, y - 4, 6, 2, '#4f5d95'); r(x - 4, y - 4, 1, 1, skin); r(x + 3, y - 4, 1, 1, skin);
  } else {                        /* overalls */
    r(x - 3, y - 8, 6, 4, '#fff3d6'); r(x - 2, y - 6, 4, 3, dress); r(x - 2, y - 8, 1, 2, dress); r(x + 1, y - 8, 1, 2, dress);
    r(x - 3, y - 4, 6, 2, dress); r(x - 3, y - 3, 6, 1, dd); r(x - 4, y - 8, 1, 2, '#fff3d6'); r(x + 3, y - 8, 1, 2, '#fff3d6');
    r(x - 4, y - 6, 1, 2, skin); r(x + 3, y - 6, 1, 2, skin);
  }
  r(x - 3, y - 13, 6, 5, skin);
  if (o.style === 1) r(x - 3, y - 9, 6, 1, dd);
  r(x - 4, y - 14, 8, 3, hair); r(x - 4, y - 11, 1, 5, hair); r(x + 3, y - 11, 1, 5, hair);
  if (player.dir === 'up') r(x - 3, y - 11, 6, 3, hair);
  else {
    const ex = player.dir === 'left' ? -3 : player.dir === 'right' ? 0 : -2;
    const gap = player.dir === 'down' ? 3 : 2;
    r(x + ex, y - 10, 1, 1, '#4a2a45'); r(x + ex + gap, y - 10, 1, 1, '#4a2a45');
    r(x - 3, y - 9, 1, 1, '#ffb0c4'); r(x + 2, y - 9, 1, 1, '#ffb0c4');
  }
  if (bow.c) { r(x + 1, y - 16, 4, 2, bow.c); r(x + 2, y - 15, 2, 1, bow.l); }
}

/* ===== Companions: kitty, partner, butterflies, flowers ===== */
const pet = { x: 70, y: 90, fx: 1, moving: false, t: 0, stuck: 0 };
const partner = { x: 130, y: 76, dir: 'left', moving: false, t: 0, visible: false };
const DIRV = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };

function updatePet(dt, live){
  pet.moving = false; if (!live) return;
  const v = DIRV[player.dir];
  const tx = Math.min(BOUNDS.x1, Math.max(BOUNDS.x0, player.x - v[0] * 10)), ty = Math.min(BOUNDS.y1, Math.max(BOUNDS.y0, player.y - v[1] * 8 + 1));
  const dx = tx - pet.x, dy = ty - pet.y, d = Math.hypot(dx, dy);
  if (d <= 3) { pet.stuck = 0; return; }
  const sp = Math.min(d * 4, 58) * dt, nx = pet.x + dx / d * sp, ny = pet.y + dy / d * sp;
  let moved = false;
  if (!blocked(nx, pet.y)) { pet.x = nx; moved = true; }
  if (!blocked(pet.x, ny)) { pet.y = ny; moved = true; }
  pet.moving = moved; if (moved) pet.t += dt;

}

    const a = Math.atan2(b.ty - b.y, b.tx - b.x);

/* Final scene: fade out, Eca and her favorite person walk toward each other, then the gift appears */

/* ===== Update ===== */
function blocked(x, y){
  const bx = x - 3, by = y - 3, bw = 6, bh = 3;
  return obstacles.some(o => bx < o.box[0] + o.box[2] && bx + bw > o.box[0] && by < o.box[1] + o.box[3] && by + bh > o.box[1]);
}
function update(dt){
  time += dt;
  const live = state === 'play' || state === 'walk';
  updatePet(dt, live); updateFlowers(dt, live); updateButterflies(dt);
  if (state === 'play') {
    let dx = (keyHeld.right ? 1 : 0) - (keyHeld.left ? 1 : 0);
    let dy = (keyHeld.down ? 1 : 0) - (keyHeld.up ? 1 : 0);
    if (joy.x || joy.y) { dx = joy.x; dy = joy.y; }
    player.moving = !!(dx || dy);
    if (player.moving) {
      const len = Math.hypot(dx, dy), sp = 52 * Math.min(1, len) * dt;
      const nx = Math.min(BOUNDS.x1, Math.max(BOUNDS.x0, player.x + dx / len * sp));
      const ny = Math.min(BOUNDS.y1, Math.max(BOUNDS.y0, player.y + dy / len * sp));
      if (!blocked(nx, player.y)) player.x = nx;
      if (!blocked(player.x, ny)) player.y = ny;
      player.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      player.t += dt;
    }
    hearts.forEach(h => { if (!h.got && state === 'play' && Math.hypot(player.x - h.x, player.y - 6 - h.y) < 8) collect(h); });
  } else if (state === 'walk') {
    updateWalk(dt);
  } else if (state === 'gift') {
    giftT += dt;
    if (giftT > .2) $('note').classList.remove('show');
    if (!giftOpened && giftT > 1.4) {
      giftOpened = true; sfxEnding(); buzz([40, 60, 40]); sparkle(80, 60, 40);
      for (let i = 0; i < 26; i++) floatHeart(80, 66, (Math.random() - .5) * 60, -20 - Math.random() * 40, 2.5 + Math.random() * 1.5);
    }
    if (giftT > 3.8 && !endShown) showEnd();
  } else if (state === 'end') {
    ambient -= dt;
    if (ambient <= 0) { ambient = .22; floatHeart(8 + Math.random() * 144, H + 4, (Math.random() - .5) * 8, -14 - Math.random() * 14, 7); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.h) p.vy += 40 * dt; else p.x += Math.sin(time * 3 + p.y * .1) * .15;
    if (p.life <= 0) parts.splice(i, 1);
  }
  pollen.forEach(p => { p.x += p.s * dt * .6; p.y += Math.sin(time + p.s) * dt * 3; if (p.x > W) p.x = 0; });
}

  if (giftOpened) { ctx.fillStyle = 'rgba(255,236,170,.3)'; ctx.fillRect(70, 0, 20, gy + 8); ctx.fillRect(74, 0, 12, gy + 8); }
  r(68 + shake, gy + 8, 24, 16, '#ff7fae'); r(68 + shake, gy + 20, 24, 4, '#e8639a'); r(78 + shake, gy + 8, 4, 16, '#fff3d6');
  ctx.globalAlpha = Math.max(.25, 1 - lift / 36);

  r(66 + shake, ly, 28, 7, '#ff95bd'); r(78 + shake, ly, 4, 7, '#fff3d6');
  r(73 + shake, ly - 3, 5, 3, '#fff3d6'); r(82 + shake, ly - 3, 5, 3, '#fff3d6'); r(78 + shake, ly - 2, 4, 2, '#ffd1e3');
  ctx.globalAlpha = 1;

function render(){

    r(cx, y, 22, 3, 'rgba(255,240,250,.75)'); r(cx + 4, y - 2, 12, 2, 'rgba(255,240,250,.75)'); });

  list.push({ y: player.y, f: drawPlayer }, { y: pet.y, f: drawCat });
  if (partner.visible) list.push({ y: partner.y, f: drawPartner });
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());

}

let last = performance.now();
function loop(now){

/* Analog joystick: drag the knob, speed follows how far you push */
const joyEl = $('joy'), knob = $('knob');
function joyMove(e){
  const b = joyEl.getBoundingClientRect(), R = b.width / 2, max = R - 12;
  let dx = e.clientX - (b.left + R), dy = e.clientY - (b.top + R);
  const m = Math.hypot(dx, dy);
  if (m > max) { dx = dx / m * max; dy = dy / m * max; }
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  const nx = dx / max, ny = dy / max;
  if (Math.hypot(nx, ny) < .18) { joy.x = joy.y = 0; } else { joy.x = nx; joy.y = ny; }
}
function joyEnd(e){
  if (joy.id === null || e.pointerId !== joy.id) return;
  joy.id = null; joy.x = joy.y = 0; knob.style.transform = '';
}
joyEl.addEventListener('pointerdown', e => {
  e.preventDefault(); if (joy.id !== null) return; joy.id = e.pointerId;
  try { joyEl.setPointerCapture(e.pointerId); } catch (x) {} joyMove(e);
});
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) { e.preventDefault(); joyMove(e); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => joyEl.addEventListener(t, joyEnd));
joyEl.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.target.closest('#joy')) e.preventDefault(); }, { passive: false });

    else { r(x - 9, y - 6, 18, 12, '#fff7e8'); r(x - 9, y - 6, 18, 1, '#d6407f'); r(x - 9, y + 5, 18, 1, '#d6407f');
      if (op) { r(x - 9, y - 12, 18, 6, '#e8b4cc'); r(x - 6, y - 9, 12, 6, '#fff'); sprite(HEART_TINY, x, y - 6, '#ff5c93'); }
      else { for (let k = 0; k < 9; k++) { r(x - 9 + k, y - 6 + k, 1, 1, '#e8b4cc'); r(x + 8 - k, y - 6 + k, 1, 1, '#e8b4cc'); } r(x - 2, y - 2, 5, 4, '#ff5c93'); } }
    if (op) { r(x + 8, y - 12, 1, 3, '#fff'); r(x + 7, y - 11, 3, 1, '#fff'); }
  });
  if (l3.doorOn) {
    ctx.globalAlpha = .3 + .15 * Math.sin(time * 3); r(130, 48, 30, 46, '#ffe9a8'); ctx.globalAlpha = 1;
    r(136, 54, 18, 38, '#8a4a7a'); r(138, 56, 14, 36, '#ffe9a8'); r(140, 52, 10, 2, '#8a4a7a'); r(144, 70, 2, 2, '#ff8fb8'); sprite(HEART_TINY, 145, 62, '#ff5c93');
  }
  drawCouple(); drawParts3();
}
function giftBox(cx, gy, lift, shake){
  r(cx - 12 + shake, gy, 24, 16, '#ff7fae'); r(cx - 12 + shake, gy + 12, 24, 4, '#e8639a'); r(cx - 2 + shake, gy, 4, 16, '#fff3d6');
  ctx.globalAlpha = cl(1 - lift / 36, .25, 1); const ly = gy - 6 - lift;
  r(cx - 14 + shake, ly, 28, 7, '#ff95bd'); r(cx - 2 + shake, ly, 4, 7, '#fff3d6'); r(cx - 7 + shake, ly - 3, 5, 3, '#fff3d6'); r(cx + 2 + shake, ly - 3, 5, 3, '#fff3d6'); r(cx - 2 + shake, ly - 2, 4, 2, '#ffd1e3');
  ctx.globalAlpha = 1;
}
function drawStageC(){
  for (let y = 0; y < 88; y += 6) r(0, y, W, 6, mix('#3b2370', '#8a4a9f', y / 88));
  for (let i = 0; i < 30; i++) { ctx.globalAlpha = .4 + .4 * Math.sin(time * 2 + i); r((i * 37) % W, (i * 23) % 80, 1, 1, '#fff3d6'); } ctx.globalAlpha = 1;
  [[26, 40], [134, 40]].forEach(([x, y]) => { ctx.globalAlpha = .25 + .1 * Math.sin(time * 3); r(x - 14, y - 12, 28, 24, '#ffe27a'); ctx.globalAlpha = 1; sprite(HEART_BIG, x, y, '#ffd1e3', 3, '#fff3d6'); });
  r(0, 88, W, 32, '#e8c27a'); for (let y = 88, k = 0; y < H; y += 8, k++) for (let x = (k % 2) * 16; x < W; x += 32) r(x, y, 16, 8, '#d9ad62');
  const open = state === 'l3open', t = l3.openT;
  ctx.globalAlpha = .15 + .08 * Math.sin(time * 3); r(52, 42, 56, 46, '#ffd1e3'); r(60, 50, 40, 36, '#fff3d6'); ctx.globalAlpha = 1;
  if (open && t > .9) { ctx.globalAlpha = .3; r(70, 0, 20, 66, '#ffe9a8'); r(74, 0, 12, 66, '#fff3d6'); ctx.globalAlpha = 1; }
  r(66, 84, 28, 2, 'rgba(0,0,0,.2)');
  giftBox(80, 66, open && t > .9 ? Math.min((t - .9) * 45, 32) : 0, open && t < .9 ? Math.round(Math.sin(t * 50)) : 0);
  if (open && t > .9) sprite(HEART_BIG, 80, 56 - Math.min((t - .9) * 14, 26) + Math.sin(time * 4), '#ff5c93', 2, '#ffb3cf');
  drawCouple(); drawParts3();
}
function drawEnding(){
  ctx.drawImage(bg2, 0, 0); drawTwinkle();
  for (let y = 0; y < H; y += 6) { ctx.fillStyle = (y < 60 ? 'rgba(150,110,230,' : 'rgba(255,150,195,') + (.1 + .3 * y / H) + ')'; ctx.fillRect(0, y, W, 6); }
  layer(forestA, .25); layer(forestB, .5);
  r(0, 100, W, 20, '#3a2d70'); r(0, 100, W, 2, '#6f62c4');
  for (let x = 8; x < W; x += 14) { ctx.globalAlpha = .15 + .1 * Math.sin(time * 2 + x); r(x - 3, 92, 7, 7, '#c9a0ff'); ctx.globalAlpha = 1; r(x, 97, 1, 3, '#3f7a6a'); r(x - 1, 95, 3, 1, '#b784f5'); r(x, 94, 1, 1, '#b784f5'); }
  drawConstellation(); drawCouple(); drawParts3();
}
function renderL3(){
  if (state === 'l3a' || state === 'l3door') drawStageA();
  else if (state === 'l3b') drawStageB();
  else if (state === 'l3c' || state === 'l3open') drawStageC();
  else drawEnding();
  if (fade > 0) { ctx.fillStyle = 'rgba(53,38,74,' + fade + ')'; ctx.fillRect(0, 0, W, H); }
  const lv = $('love'), show = l2.loveShow > 0 && state === 'l3a', sc = cv.clientWidth / W;
  lv.classList.toggle('show', show);
  if (show) { lv.style.left = cl((partner.x - camX) * sc, 56, cv.clientWidth - 56) + 'px'; lv.style.top = (partner.y - 20) * sc + 'px'; }
  if (paused) { ctx.fillStyle = 'rgba(53,38,74,.5)'; ctx.fillRect(0, 0, W, H);
    r(50, 50, 60, 20, '#fff7e8'); r(52, 52, 56, 16, '#ffd1e3'); ctx.fillStyle = '#5a3a55'; ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center'; ctx.fillText('PAUSED', 80, 64); }
}

/* Level 3 controls: tap objects on the canvas, plus the DOM buttons */
cv.addEventListener('pointerdown', e => { const b = cv.getBoundingClientRect(); tapL3((e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H); });
$('l3Btn').addEventListener('click', () => { if (l2Done && state === 'title') startLevel3(); });
$('l3Gift').addEventListener('click', openFinalGift);
$('l3Again').addEventListener('click', backToTitle);
$('l3Read').addEventListener('click', () => { $('l3end').classList.remove('show'); openLetter(); });

/* ================= Outfit customizer (shown before the adventure starts) ================= */
/* ===== EDIT ME: greeting ===== */
const CUST_TITLE = "Hai, sayang ♡";
const CUST_TEXT = "Choose your outfit to start our adventure together.";
let outfit = { style: 0, color: 0, hair: 0, bow: 0 }, custOpen = false, custMode = 'start';
try { const o = JSON.parse(localStorage.getItem('eca_outfit'));
  if (o) Object.keys(outfit).forEach(k => { outfit[k] = cl(o[k] | 0, 0, { style: 2, color: DRESS_COLORS.length - 1, hair: HAIRS.length - 1, bow: BOWS.length - 1 }[k]); }); } catch (e) {}
function saveOutfit(){ try { localStorage.setItem('eca_outfit', JSON.stringify(outfit)); } catch (e) {} }
const swGroups = [['style', 'rowStyle', STYLE_NAMES.map(n => ({ n }))], ['color', 'rowColor', DRESS_COLORS], ['hair', 'rowHair', HAIRS], ['bow', 'rowBow', BOWS]];
const swBtns = {};
function buildCust(){
  $('custTitle').textContent = CUST_TITLE; $('custText').textContent = CUST_TEXT;
  swGroups.forEach(([key, rowId, items]) => {
    swBtns[key] = items.map((it, i) => {
      const b = document.createElement('button'); b.className = key === 'style' ? 'sw txt' : 'sw'; b.title = it.n;
      if (key === 'style') b.textContent = it.n; else if (it.c) b.style.background = it.c; else { b.textContent = '✕'; b.style.background = '#fff7e8'; }
      b.addEventListener('click', () => { outfit[key] = i; refreshCust(); });
      $(rowId).appendChild(b); return b;
    });
  });
}
function refreshCust(){ swGroups.forEach(([key]) => swBtns[key].forEach((b, i) => b.classList.toggle('on', outfit[key] === i))); drawPreview(); }
function drawPreview(){
  const pc = $('prevCv'), main = ctx, sv = { x: player.x, y: player.y, dir: player.dir, moving: player.moving, t: player.t };
  const tt = performance.now() / 1000;
  ctx = pc.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, 24, 32);
  Object.assign(player, { x: 12, y: 28, dir: ['down', 'right', 'down', 'left'][Math.floor(tt / .9) % 4], moving: true, t: tt });
  drawPlayer(); ctx = main; Object.assign(player, sv);
}
function openCust(mode){
  custMode = mode; custOpen = true; initAudio();
  $('custGo').textContent = mode === 'start' ? 'Start the Adventure ♡' : 'Save outfit ♡';
  $('cust').classList.add('show'); refreshCust();
}
$('custGo').addEventListener('click', () => { saveOutfit(); custOpen = false; $('cust').classList.remove('show'); if (custMode === 'start') startGame(); });
$('outfitBtn').addEventListener('click', () => { if (state === 'title' && !custOpen) openCust('title'); });

/* ===== Go! ===== */
buildBackground(); buildNight(); buildCastle(); buildCust(); resetGame(); refreshL2Btn(); fit(); requestAnimationFrame(loop);
